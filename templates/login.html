<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width, initial-scale=1.0"/>
<title>MediNoteX – Sign In</title>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&display=swap" rel="stylesheet"/>
<link rel="stylesheet" href="{{ url_for('static', filename='css/tokens.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/base.css') }}">
<link rel="stylesheet" href="{{ url_for('static', filename='css/components.css') }}">
<style>
  body { font-family: var(--font); min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 24px; }
  .login-card { width: 100%; max-width: 420px; }
  .login-logo { font-size: 28px; font-weight: 900; color: var(--primary); margin-bottom: 6px; }
  .login-sub { color: var(--t2); font-size: 14px; margin-bottom: 24px; }
  .field { margin-bottom: 14px; }
  .field label { display: block; font-size: 12px; font-weight: 600; color: var(--t2); margin-bottom: 6px; }
  .field input { width: 100%; padding: 10px 12px; border: 1px solid var(--border); border-radius: 10px; font-size: 14px; background: var(--surface); color: var(--t1); }
  .err { color: var(--danger); font-size: 13px; margin-top: 12px; display: none; }
</style>
</head>
<body>
<div class="card login-card">
  <div class="card-bd">
    <div class="login-logo">MediNoteX</div>
    <p class="login-sub">Enterprise sign in · <a href="/" style="color:var(--primary)">Back to Home</a></p>
    <form id="loginForm">
      <div class="field">
        <label for="email">Email</label>
        <input id="email" type="email" required autocomplete="username" placeholder="sarah.chen@medinotex.io"/>
      </div>
      <div class="field">
        <label for="password">Password</label>
        <input id="password" type="password" required autocomplete="current-password" placeholder="••••••••"/>
      </div>
      <label style="display:flex;align-items:center;gap:8px;font-size:13px;color:var(--t2);margin-bottom:16px">
        <input type="checkbox" id="remember" checked/> Remember me
      </label>
      <button type="submit" class="btn btn-primary" style="width:100%" id="loginBtn">Sign In</button>
      <p class="err" id="loginError"></p>
    </form>
  </div>
</div>
<script src="{{ url_for('static', filename='js/api.js') }}"></script>
<script src="{{ url_for('static', filename='js/components.js') }}"></script>
<script>
function dashboardForRole(role) {
  if (role === 'medical_coder' || role === 'coder') return '/coder';
  return '/dashboard';
}

document.getElementById('loginForm').addEventListener('submit', async (e) => {
  e.preventDefault();
  const btn = document.getElementById('loginBtn');
  const errEl = document.getElementById('loginError');
  errEl.style.display = 'none';
  btn.disabled = true;
  btn.textContent = 'Signing in…';
  try {
    const res = await MNXApi.login(
      document.getElementById('email').value.trim(),
      document.getElementById('password').value,
      document.getElementById('remember').checked
    );
    window.location.href = dashboardForRole(res.user && res.user.role);
  } catch (err) {
    errEl.textContent = err.message || 'Login failed';
    errEl.style.display = 'block';
    btn.disabled = false;
    btn.textContent = 'Sign In';
  }
});

MNXApi.me().then((user) => {
  window.location.href = dashboardForRole(user && user.role);
}).catch(() => {});
</script>
</body>
</html>
